<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriGuide - Smart Wellness</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #FBFDFA; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .history-card:hover .delete-btn { opacity: 1; }
    </style>
</head>
<body class="text-slate-800 pb-10">

    <header class="bg-white/80 backdrop-blur-md border-b border-emerald-100 px-4 md:px-8 py-4 sticky top-0 z-50 flex items-center justify-between shadow-sm">
        <div class="flex items-center gap-3">
            <div class="bg-gradient-to-br from-emerald-500 to-teal-600 p-2.5 rounded-xl shadow-lg">
                <i class="fa-solid fa-leaf text-white text-xl"></i>
            </div>
            <div>
                <h1 class="text-xl md:text-2xl font-black text-slate-900 tracking-tight leading-none">NutriGuide</h1>
                <span id="ui-engine-tag" class="text-[10px] font-bold text-emerald-500 uppercase tracking-widest">Smart AI Engine</span>
            </div>
        </div>
        
        <div class="flex items-center gap-3">
            <!-- Language Selector -->
            <div class="relative group">
                <select id="langSelect" class="appearance-none bg-slate-100 border border-slate-200 text-[10px] md:text-xs font-bold py-2 pl-3 pr-8 rounded-full focus:ring-2 focus:ring-emerald-500 outline-none cursor-pointer">
                    <option value="id">🇮🇩 ID</option>
                    <option value="en">🇺🇸 EN</option>
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-400">
                    <i class="fa-solid fa-chevron-down text-[8px]"></i>
                </div>
            </div>
            
            <!-- Settings Button -->
            <button id="openSettingsBtn" class="text-xs font-bold bg-slate-100 w-8 h-8 rounded-full border border-slate-200 hover:bg-emerald-50 hover:text-emerald-600 transition-all flex items-center justify-center text-slate-500" title="Settings">
                <i class="fa-solid fa-gear"></i>
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 md:p-8 flex flex-col lg:grid lg:grid-cols-12 gap-8">
        <aside class="lg:col-span-4 space-y-6">
            <div class="bg-white p-6 rounded-3xl shadow-xl shadow-emerald-900/5 border border-emerald-50">
                <h2 class="font-black text-lg text-slate-800 mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-utensils text-emerald-500"></i> <span id="ui-sidebar-title">Buat Jadwal Diet</span>
                </h2>
                <textarea id="promptInput" 
                    class="w-full h-28 p-4 rounded-2xl bg-slate-50 border-2 border-transparent focus:bg-white focus:border-emerald-400 outline-none resize-none transition-all text-sm mb-4"
                    placeholder="Contoh: Diet Keto, Rendah Karbo, atau Vegan..."></textarea>
                
                <button id="generateBtn" 
                    class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-4 rounded-2xl shadow-lg shadow-emerald-600/20 flex items-center justify-center gap-3 transition-transform active:scale-95 disabled:opacity-70 disabled:cursor-not-allowed disabled:transform-none">
                    <i id="btnIcon" class="fa-solid fa-wand-magic-sparkles"></i> 
                    <span id="ui-btn-text">Dapatkan Panduan</span>
                </button>

                <div class="mt-8">
                    <h3 id="ui-history-title" class="text-[10px] font-black uppercase text-slate-400 tracking-widest mb-3">Riwayat Diet</h3>
                    <div id="historyList" class="space-y-2 max-h-60 overflow-y-auto pr-2 scrollbar-hide">
                        <p id="ui-no-history" class="text-xs text-slate-400 italic py-2">Belum ada riwayat.</p>
                    </div>
                </div>
            </div>
        </aside>

        <section class="lg:col-span-8">
            <div class="bg-white rounded-3xl shadow-xl shadow-emerald-900/5 border border-emerald-50 p-6 min-h-[500px]">
                <div id="calendarHeader" class="hidden mb-6 flex justify-between items-center border-b pb-4">
                    <h2 id="planTitle" class="text-xl md:text-2xl font-black text-slate-800">Nama Rencana</h2>
                    <span id="ui-days-tag" class="text-[10px] md:text-xs bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full font-bold uppercase whitespace-nowrap">7 Hari</span>
                </div>
                
                <div id="emptyState" class="h-96 flex flex-col items-center justify-center text-center">
                    <div class="bg-emerald-50 p-8 rounded-full mb-4 text-emerald-200">
                        <i class="fa-solid fa-calendar-check text-5xl"></i>
                    </div>
                    <p id="ui-empty-title" class="font-black text-slate-400 text-lg">Siap Menyusun Jadwal</p>
                    <p id="ui-empty-desc" class="text-sm text-slate-300 mt-1">Ketik jenis diet Anda di samping.</p>
                </div>

                <div id="calendarGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4 hidden"></div>
            </div>
        </section>
    </main>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm">
        <div class="bg-white w-full max-w-md rounded-3xl p-6 shadow-2xl transform transition-all">
            <div class="flex justify-between items-center mb-4">
                <h3 id="ui-modal-title" class="font-black text-lg text-slate-800">Pengaturan</h3>
                <button id="closeSettingsBtn" class="text-slate-400 hover:text-rose-500 transition-colors"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <p id="ui-modal-desc" class="text-xs text-slate-500 mb-4">Masukkan API Key Anda (Opsional). Kosongkan untuk menggunakan kuota bawaan.</p>
            <input type="password" id="apiKeyInput" placeholder="Gemini API Key..." 
                class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm outline-none mb-4 focus:border-emerald-400 focus:bg-white transition-colors">
            <button id="saveSettingsBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition-colors">
                <span id="ui-save-btn">Simpan Pengaturan</span>
            </button>
        </div>
    </div>

    <!-- Toast Notification (replaces alert) -->
    <div id="toast" class="fixed bottom-6 right-6 bg-rose-600 text-white px-6 py-4 rounded-2xl shadow-2xl transform translate-y-32 opacity-0 transition-all duration-300 z-50 flex items-center gap-3">
        <i class="fa-solid fa-triangle-exclamation text-lg"></i>
        <span id="toastMessage" class="text-sm font-bold"></span>
    </div>

    <script>
        // Environment API Key (Canvas environment requirement)
        const apiKey = ""; 

        const translations = {
            id: {
                engine: "Smart AI Engine",
                sidebarTitle: "Buat Jadwal Diet",
                placeholder: "Contoh: Diet Keto untuk pemula, Rendah Karbo, atau Vegan hemat...",
                btnText: "Dapatkan Panduan",
                btnLoading: "Menyusun Diet...",
                btnCancel: "Batalkan",
                cancelled: "Proses dibatalkan.",
                recipePrefix: "Resep",
                searchRecipe: "Cari resep",
                historyTitle: "Riwayat Diet",
                noHistory: "Belum ada riwayat.",
                daysTag: "7 Hari",
                emptyTitle: "Siap Menyusun Jadwal",
                emptyDesc: "Ketik jenis diet Anda di samping.",
                dayLabel: "Hari",
                apiError: "Koneksi AI gagal. Periksa API Key Anda atau coba lagi.",
                modalTitle: "Pengaturan",
                modalDesc: "Masukkan API Key Anda (Opsional). Kosongkan untuk menggunakan kuota bawaan.",
                saveBtn: "Simpan Pengaturan",
                saveToast: "Pengaturan disimpan!"
            },
            en: {
                engine: "Smart AI Engine",
                sidebarTitle: "Create Diet Plan",
                placeholder: "Example: Keto for beginners, Low Carb, or budget Vegan...",
                btnText: "Get Guide",
                btnLoading: "Generating...",
                btnCancel: "Cancel",
                cancelled: "Process cancelled.",
                recipePrefix: "Recipe",
                searchRecipe: "Search recipe",
                historyTitle: "Diet History",
                noHistory: "No history yet.",
                daysTag: "7 Days",
                emptyTitle: "Ready to Plan",
                emptyDesc: "Type your diet type on the side.",
                dayLabel: "Day",
                apiError: "AI connection failed. Please check your API Key or try again.",
                modalTitle: "Settings",
                modalDesc: "Enter your API Key (Optional). Leave empty to use default quota.",
                saveBtn: "Save Settings",
                saveToast: "Settings saved!"
            }
        };

        let currentLang = localStorage.getItem('nutriguide_lang') || "id";
        let history = JSON.parse(localStorage.getItem('nutriguide_history')) || [];
        let userApiKey = localStorage.getItem('nutriguide_key') || "";
        let isGenerating = false;
        let abortController = null;

        function updateUILanguage() {
            const t = translations[currentLang];
            document.getElementById('ui-engine-tag').innerText = t.engine;
            document.getElementById('ui-sidebar-title').innerText = t.sidebarTitle;
            document.getElementById('promptInput').placeholder = t.placeholder;
            document.getElementById('ui-btn-text').innerText = t.btnText;
            document.getElementById('ui-history-title').innerText = t.historyTitle;
            document.getElementById('ui-no-history').innerText = t.noHistory;
            document.getElementById('ui-days-tag').innerText = t.daysTag;
            document.getElementById('ui-empty-title').innerText = t.emptyTitle;
            document.getElementById('ui-empty-desc').innerText = t.emptyDesc;
            document.getElementById('ui-modal-title').innerText = t.modalTitle;
            document.getElementById('ui-modal-desc').innerText = t.modalDesc;
            document.getElementById('ui-save-btn').innerText = t.saveBtn;
            document.getElementById('langSelect').value = currentLang;
            renderHistory();
        }

        function showToast(message, isSuccess = false) {
            const toast = document.getElementById('toast');
            const icon = toast.querySelector('i');
            
            if (isSuccess) {
                toast.classList.replace('bg-rose-600', 'bg-emerald-600');
                icon.className = "fa-solid fa-check-circle text-lg";
            } else {
                toast.classList.replace('bg-emerald-600', 'bg-rose-600');
                icon.className = "fa-solid fa-triangle-exclamation text-lg";
            }
            
            document.getElementById('toastMessage').innerText = message;
            toast.classList.remove('translate-y-32', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-32', 'opacity-0');
            }, 4000);
        }

        async function fetchAIPlanWithBackoff(promptText, signal) {
            const maxRetries = 5;
            const delays = [1000, 2000, 4000, 8000, 16000];
            
            const promptStr = `Create a 7-day diet plan for the user's request: "${promptText}". Language: ${currentLang}. Make sure the meals are realistic, varied, and appropriate for the diet requested. Ensure exactly 7 days are generated.`;

            // Enforcing strict JSON schema for 2.5-flash
            const schema = {
                type: "OBJECT",
                properties: {
                    planName: { type: "STRING", description: "A catchy title for the diet plan" },
                    meals: {
                        type: "ARRAY",
                        description: "An array containing exactly 7 daily meal plans",
                        items: {
                            type: "OBJECT",
                            properties: {
                                day: { type: "INTEGER" },
                                breakfast: { type: "STRING" },
                                lunch: { type: "STRING" },
                                dinner: { type: "STRING" }
                            },
                            required: ["day", "breakfast", "lunch", "dinner"]
                        }
                    }
                },
                required: ["planName", "meals"]
            };

            const activeKey = userApiKey || apiKey;

            for (let i = 0; i <= maxRetries; i++) {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${activeKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        signal: signal,
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: promptStr }] }],
                            generationConfig: { 
                                responseMimeType: "application/json",
                                responseSchema: schema
                            }
                        })
                    });

                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    const data = await response.json();
                    
                    if(data.candidates && data.candidates[0].content.parts[0].text) {
                        return JSON.parse(data.candidates[0].content.parts[0].text);
                    } else {
                        throw new Error("Invalid response structure from AI");
                    }
                } catch (e) {
                    if (e.name === 'AbortError') throw e;
                    if (i === maxRetries) throw e;
                    await new Promise(resolve => setTimeout(resolve, delays[i]));
                }
            }
        }

        async function handleGenerate() {
            if (isGenerating) {
                if (abortController) abortController.abort();
                return;
            }

            const prompt = document.getElementById('promptInput').value.trim();
            if (!prompt) return;

            const btn = document.getElementById('generateBtn');
            const btnSpan = document.getElementById('ui-btn-text');
            const btnIcon = document.getElementById('btnIcon');
            
            isGenerating = true;
            abortController = new AbortController();

            // Transform button to "Cancel" state
            btn.classList.remove('bg-emerald-600', 'hover:bg-emerald-700', 'shadow-emerald-600/20');
            btn.classList.add('bg-rose-500', 'hover:bg-rose-600', 'shadow-rose-500/20');
            btnSpan.innerText = translations[currentLang].btnCancel;
            btnIcon.className = "fa-solid fa-xmark";

            try {
                const plan = await fetchAIPlanWithBackoff(prompt, abortController.signal);
                addToHistory(prompt, plan);
                renderCalendar(plan);
            } catch (e) {
                if (e.name === 'AbortError') {
                    showToast(translations[currentLang].cancelled);
                } else {
                    showToast(translations[currentLang].apiError);
                }
            } finally {
                isGenerating = false;
                abortController = null;
                
                // Revert button to normal state
                btn.classList.add('bg-emerald-600', 'hover:bg-emerald-700', 'shadow-emerald-600/20');
                btn.classList.remove('bg-rose-500', 'hover:bg-rose-600', 'shadow-rose-500/20');
                btnSpan.innerText = translations[currentLang].btnText;
                btnIcon.className = "fa-solid fa-wand-magic-sparkles";
            }
        }

        function renderCalendar(plan) {
            const grid = document.getElementById('calendarGrid');
            const empty = document.getElementById('emptyState');
            const header = document.getElementById('calendarHeader');
            
            grid.innerHTML = "";
            grid.classList.remove('hidden');
            empty.classList.add('hidden');
            header.classList.remove('hidden');
            document.getElementById('planTitle').innerText = plan.planName;

            const t = translations[currentLang];
            const makeLink = (food) => `<a href="https://www.google.com/search?q=${encodeURIComponent(t.recipePrefix + ' ' + food)}" target="_blank" class="block text-xs font-semibold text-slate-700 hover:text-emerald-600 hover:underline cursor-pointer transition-colors" title="${t.searchRecipe}: ${food}">${food}</a>`;

            plan.meals.forEach(m => {
                const day = document.createElement('div');
                day.className = "bg-white border border-slate-100 rounded-2xl p-4 shadow-sm hover:shadow-md hover:border-emerald-200 transition-all duration-300 group";
                day.innerHTML = `
                    <div class="flex items-center justify-between mb-3 border-b border-slate-50 pb-2">
                        <div class="text-[10px] font-black text-emerald-500 uppercase tracking-widest">${translations[currentLang].dayLabel} ${m.day}</div>
                    </div>
                    <div class="space-y-3">
                        <div class="leading-tight group-hover:translate-x-1 transition-transform">
                            <div class="text-[10px] font-bold text-slate-400 uppercase mb-0.5"><i class="fa-solid fa-mug-hot mr-1"></i> Pagi</div>
                            ${makeLink(m.breakfast)}
                        </div>
                        <div class="leading-tight group-hover:translate-x-1 transition-transform delay-75">
                            <div class="text-[10px] font-bold text-slate-400 uppercase mb-0.5"><i class="fa-solid fa-bowl-food mr-1"></i> Siang</div>
                            ${makeLink(m.lunch)}
                        </div>
                        <div class="leading-tight group-hover:translate-x-1 transition-transform delay-100">
                            <div class="text-[10px] font-bold text-slate-400 uppercase mb-0.5"><i class="fa-solid fa-utensils mr-1"></i> Malam</div>
                            ${makeLink(m.dinner)}
                        </div>
                    </div>
                `;
                grid.appendChild(day);
            });
        }

        function addToHistory(query, plan) {
            const newItem = { id: Date.now(), query: query, plan: plan };
            history.unshift(newItem);
            if (history.length > 10) history.pop(); // Keep only last 10
            localStorage.setItem('nutriguide_history', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            const container = document.getElementById('historyList');
            const noHistory = document.getElementById('ui-no-history');
            
            if (history.length === 0) {
                noHistory.classList.remove('hidden');
                container.innerHTML = "";
                container.appendChild(noHistory);
                return;
            }
            
            noHistory.classList.add('hidden');
            container.innerHTML = history.map(item => `
                <div class="history-card group flex items-center justify-between p-3 bg-slate-50 hover:bg-emerald-50 rounded-xl cursor-pointer transition-all border border-transparent hover:border-emerald-100" onclick="loadFromHistory(${item.id})">
                    <div class="flex items-center gap-3 overflow-hidden">
                        <div class="bg-white p-1.5 rounded-lg shadow-sm group-hover:text-emerald-500 transition-colors text-slate-400">
                            <i class="fa-solid fa-clock-rotate-left text-[10px]"></i>
                        </div>
                        <span class="text-xs font-semibold text-slate-600 truncate">${item.query}</span>
                    </div>
                    <button onclick="deleteHistory(event, ${item.id})" class="delete-btn opacity-0 text-slate-300 hover:text-rose-500 transition-all px-2 py-1">
                        <i class="fa-solid fa-trash-can text-[10px]"></i>
                    </button>
                </div>
            `).join('');
        }

        window.loadFromHistory = (id) => {
            const item = history.find(h => h.id === id);
            if (item) {
                document.getElementById('promptInput').value = item.query;
                renderCalendar(item.plan);
            }
        };

        window.deleteHistory = (e, id) => {
            e.stopPropagation();
            history = history.filter(h => h.id !== id);
            localStorage.setItem('nutriguide_history', JSON.stringify(history));
            renderHistory();
            
            // Clear grid if we deleted the currently viewed history
            if(history.length === 0) {
                document.getElementById('calendarGrid').classList.add('hidden');
                document.getElementById('calendarHeader').classList.add('hidden');
                document.getElementById('emptyState').classList.remove('hidden');
                document.getElementById('promptInput').value = "";
            }
        };

        document.getElementById('langSelect').addEventListener('change', (e) => {
            currentLang = e.target.value;
            localStorage.setItem('nutriguide_lang', currentLang);
            updateUILanguage();
        });

        document.getElementById('generateBtn').addEventListener('click', handleGenerate);

        // Modal Settings Logic
        document.getElementById('openSettingsBtn').addEventListener('click', () => {
            document.getElementById('apiKeyInput').value = userApiKey;
            document.getElementById('settingsModal').classList.remove('hidden');
        });

        document.getElementById('closeSettingsBtn').addEventListener('click', () => {
            document.getElementById('settingsModal').classList.add('hidden');
        });

        document.getElementById('saveSettingsBtn').addEventListener('click', () => {
            userApiKey = document.getElementById('apiKeyInput').value.trim();
            localStorage.setItem('nutriguide_key', userApiKey);
            document.getElementById('settingsModal').classList.add('hidden');
            showToast(translations[currentLang].saveToast, true);
        });

        // Initial Setup
        updateUILanguage();
    </script>
</body>
</html>
